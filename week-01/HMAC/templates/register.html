<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
</head>
<body>
    <h1>Регистрация</h1>

    <form method="POST" action="/register">
        <label>
            Логин:
            <input type="text" name="username" required>
        </label>
        <br><br>
        <label>
            Пароль:
            <input type="password" name="password" required minlength="8">
        </label>
        <br><br>
        <button type="submit">Зарегистрироваться</button>
    </form>
</body>
</html>
